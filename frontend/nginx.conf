server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # No cache for index.html (SPA entry)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Hashed static assets - long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Status endpoints proxying to service healthchecks without auth
    location = /status/auth {
        proxy_pass http://auth:8001/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /status/employee {
        proxy_pass http://employee:8002/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /status/leave {
        proxy_pass http://leave:8003/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /status/payroll {
        proxy_pass http://payroll:8004/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /status/notification {
        proxy_pass http://notification:8005/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /status/gateway {
        proxy_pass http://gateway:8000/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # API Proxying to Gateway (stripping /api prefix)
    location /api/ {
        proxy_pass http://gateway:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
    }

    # SPA fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
