server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # No cache for index.html (SPA entry)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Hashed static assets - long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Docker DNS resolver for dynamic IP re-resolution when containers restart/recreate
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Status endpoints proxying to service healthchecks without auth
    location = /status/auth {
        set $auth_backend "http://auth:8001/health";
        proxy_pass $auth_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /status/employee {
        set $employee_backend "http://employee:8002/health";
        proxy_pass $employee_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /status/leave {
        set $leave_backend "http://leave:8003/health";
        proxy_pass $leave_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /status/payroll {
        set $payroll_backend "http://payroll:8004/health";
        proxy_pass $payroll_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /status/notification {
        set $notification_backend "http://notification:8005/health";
        proxy_pass $notification_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /status/gateway {
        set $gateway_backend "http://gateway:8000/health";
        proxy_pass $gateway_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # API Proxying to Gateway (stripping /api prefix)
    location /api/ {
        set $gateway_backend "http://gateway:8000";
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $gateway_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
    }

    # SPA fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
