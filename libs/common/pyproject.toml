[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ems_common"
version = "0.1.0"
description = "Common library for EMS microservices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "fastapi==0.142.2",
    "starlette==1.7.0",
    "pyjwt==2.15.1",
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "pybreaker==1.4.1",
    "sqlalchemy==2.1.1",
    "asyncpg==0.31.0",
    "bcrypt==5.0.0",
    "greenlet==3.5.6",
    "aio-pika==10.1.0",
    "prometheus-fastapi-instrumentator==8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "testcontainers==4.15.0",
]

[tool.setuptools.packages.find]
where = ["."]
